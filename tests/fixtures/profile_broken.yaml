# dsh profile patch layer — 测试夹具（broken）
# 还原真实故障样本：ACP 子 agent 条目缺 maxDepth（provider "kimi" 无法自行约束递归预算），
# 同文件的 tool-subagent 条目已修好（对照组）。路径已脱敏。
- insert:
    # ─ ACP 子 agent ──────────────────────────────────────────────
    - id: subagent-acp-kimi
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: kimi
        command: kimi
        args:
          - 'acp'
        permission: allow
        env: {}

    # 面向模型的委派工具（已修好：显式交给 provider 管理）
    - id: tool-subagent-kimi
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: kimi
        toolName: subagent_kimi
        backgroundMode: one-shot
        maxDepth: 'provider-managed'

    # 带嵌套列表的条目：块内出现更深的 `- id:` 不得被当成新条目
    - id: mcp-kimicu
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        servers:
          - id: kimicu
            command: 'C:\nope\missing-kimicu.exe'
        failOnStartupError: true