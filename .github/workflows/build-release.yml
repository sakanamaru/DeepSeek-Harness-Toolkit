name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach assets to (e.g. v2.0.0); empty = build only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: unit + integration tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run unit tests (same-assembly, /define:UNIT)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /define:UNIT /out:unittests.exe dsh_v2.cs tests\unit_tests.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "unit test build failed" }
          .\unittests.exe
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }

      - name: Run integration tests (stubbed matrix, no real ~/.dsh touched)
        shell: pwsh
        run: |
          .\tests\integration.ps1 -RepoRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw "integration tests failed" }

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exe from source (csc, .NET Framework 4.x)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:exe /win32icon:icon.ico "/out:DeepSeek Harness Toolkit.exe" dsh_v2.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "csc build failed" }
          Get-Item "DeepSeek Harness Toolkit.exe" | Select-Object Name,Length

      - name: Regenerate hashes.txt from CI build
        shell: pwsh
        run: |
          $files = @('DeepSeek Harness Toolkit.exe','dsh_v2.cs','build_exe.cmd','icon.ico','logo.png','README.md','README_zh-CN.md','LICENSE','SECURITY.md','.dsh_launcher_root')
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('# SHA-256 checksum manifest - DeepSeek Harness Toolkit V2.1.0')
          $lines.Add(('# generated by GitHub Actions CI: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'))
          $lines.Add('# the exe below is built from source by the CI pipeline (source == artifact); verify the release exe against this manifest')
          $lines.Add('')
          foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines.Add("$h  $f")
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'hashes.txt'), $lines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content hashes.txt

      - name: Commit regenerated hashes.txt (only when on a branch)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git symbolic-ref -q HEAD
          if ($LASTEXITCODE -eq 0) {
            git add hashes.txt
            git commit -m "build: regenerate hashes.txt from CI build" 2>$null
            if ($LASTEXITCODE -eq 0) {
              git push
              Write-Output "hashes.txt committed and pushed"
            } else {
              Write-Output "hashes.txt unchanged; nothing to commit"
            }
          } else {
            Write-Output "detached HEAD (tag-triggered build): hashes.txt generated locally, commit skipped"
          }

      - name: Pack upload zip (12 files)
        shell: pwsh
        run: |
          $items = @('DeepSeek Harness Toolkit.exe','dsh_v2.cs','build_exe.cmd','icon.ico','logo.png','README.md','README_zh-CN.md','LICENSE','SECURITY.md','.gitignore','hashes.txt','.dsh_launcher_root')
          Compress-Archive -Path $items -DestinationPath 'DeepSeek-Harness-Toolkit_v2.1.0_upload-package.zip' -CompressionLevel Optimal
          Write-Output ("zip: " + [math]::Round((Get-Item 'DeepSeek-Harness-Toolkit_v2.1.0_upload-package.zip').Length/1KB,1) + " KB")

      - name: Attach / refresh release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -in @('main','master','')) { $tag = "${{ inputs.release_tag }}" }
          if ($tag -eq '') { Write-Output 'no release tag provided; skipping release upload'; exit 0 }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Output "release '$tag' not found; skipping upload (create it with: gh release create $tag)"; exit 0 }
          gh release upload $tag "DeepSeek Harness Toolkit.exe" --repo $env:GITHUB_REPOSITORY --clobber
          gh release upload $tag hashes.txt --repo $env:GITHUB_REPOSITORY --clobber
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          # 改名迁移安全网：清理与当前命名不一致的旧 exe 资产（注意：GitHub 会把空格转成点，须按服务器端点分名比较）
          $currentExe = 'DeepSeek.Harness.Toolkit.exe'   # GitHub 把空格转点，按服务器端点分名；只保留精确当前名
          $oldExes = $assets | Where-Object { $_ -like '*.exe' -and $_ -ne $currentExe }
          foreach ($oe in $oldExes) { gh release delete-asset $tag $oe --repo $env:GITHUB_REPOSITORY }
          $oldZip = $assets | Where-Object { $_ -like '*.zip' } | Select-Object -First 1
          if ($oldZip) { gh release delete-asset $tag $oldZip --repo $env:GITHUB_REPOSITORY }
          gh release upload $tag 'DeepSeek-Harness-Toolkit_v2.1.0_upload-package.zip' --repo $env:GITHUB_REPOSITORY
          Write-Output "assets refreshed on release $tag"