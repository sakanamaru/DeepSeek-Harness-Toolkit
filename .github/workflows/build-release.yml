name: build-release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main          # M-8：main 推送跑测试 job（build/release job 仅 tag/手动触发）
  pull_request:       # M-8：PR 也跑测试 job
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for zip naming / hashes header; assets attach ONLY on tag builds (immutable-release flow); empty = build only'
        required: false
        default: ''

# 最小权限：test 只读；build 才需要写（回推 hashes.txt / 上传 draft release 资产 / 签发 attestation）
jobs:
  test:
    name: unit + integration tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2，固定 commit SHA（供应链：不跟浮动 tag）

      - name: Build & run unit tests (same-assembly, /define:UNIT)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /define:UNIT /out:unittests.exe dsh_v2.cs tests\unit_tests.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "unit test build failed" }
          .\unittests.exe
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }

      - name: Compile GUI variants (attached + standalone) — regression guard only
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:exe /win32icon:icon.ico /out:core_check.exe dsh_v2.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "core compile failed (guard)" }
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico /win32manifest:app.manifest /resource:logo.png /out:gui_check.exe gui_v2.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI (attached) compile failed" }
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico /win32manifest:app.manifest /resource:logo.png /resource:core_check.exe,DSHCore.exe /out:gui_standalone_check.exe gui_v2.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI (standalone) compile failed" }
          Remove-Item core_check.exe, gui_check.exe, gui_standalone_check.exe -ErrorAction SilentlyContinue
          Write-Output "GUI variants compile clean (/warn:4, embedded logo + core)"

      - name: Run integration tests (stubbed matrix, no real ~/.dsh touched)
        shell: pwsh
        run: |
          .\tests\integration.ps1 -RepoRoot (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw "integration tests failed" }

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'   # M-8：发布/手动才构建产物；普通 push/PR 仅跑测试
    runs-on: windows-latest
    permissions:
      contents: write        # 回推 hashes.txt + 上传 draft release 资产
      id-token: write        # artifact attestation（OIDC）
      attestations: write    # 发布 provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2，固定 commit SHA

      - name: Build exe from source (csc, .NET Framework 4.x)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:exe /win32icon:icon.ico "/out:DeepSeek Harness Toolkit.exe" dsh_v2.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "csc build failed" }
          Get-Item "DeepSeek Harness Toolkit.exe" | Select-Object Name,Length

      - name: Compile Toolkit GUI.exe (embedded logo, single file)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico /win32manifest:app.manifest /resource:logo.png "/out:Toolkit GUI.exe" gui_v2.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI build failed" }
          Get-Item "Toolkit GUI.exe" | Select-Object Name,Length

      - name: Compile Toolkit GUI Standalone.exe (embeds core exe)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /win32icon:icon.ico /win32manifest:app.manifest /resource:logo.png "/resource:DeepSeek Harness Toolkit.exe,DSHCore.exe" "/out:Toolkit GUI Standalone.exe" gui_v2.cs /warn:4
          if ($LASTEXITCODE -ne 0) { throw "GUI standalone build failed" }
          Get-Item "Toolkit GUI Standalone.exe" | Select-Object Name,Length

      - name: Regenerate hashes.txt from CI build
        shell: pwsh
        run: |
          $files = @('DeepSeek Harness Toolkit.exe','Toolkit GUI.exe','Toolkit GUI Standalone.exe','dsh_v2.cs','build_exe.cmd','icon.ico','logo.png','README.md','README_zh-CN.md','LICENSE','SECURITY.md','verify.ps1','.dsh_launcher_root')
          # L-2：版本号从 AssemblyVersion 动态派生（取 major.minor.build 三段），避免每次 bump 手改 hashes 头（旧版本号残留）
          $verMatch = (Select-String -Path dsh_v2.cs -Pattern 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)\.\d+"' | Select-Object -First 1).Matches[0]
          $verLine = ($verMatch.Groups[1].Value + '.' + $verMatch.Groups[2].Value + '.' + $verMatch.Groups[3].Value)
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('# SHA-256 checksum manifest - DeepSeek Harness Toolkit V' + $verLine)
          $lines.Add(('# generated by GitHub Actions CI: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'))
          $lines.Add('# the exe below is built from source by the CI pipeline (source == artifact); verify the release exe against this manifest')
          $lines.Add('')
          foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines.Add("$h  $f")
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'hashes.txt'), $lines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content hashes.txt

      - name: Sign hashes.txt (maintainer GPG key, from secrets)
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # runner is a fresh machine per job: default ~/.gnupg is fine.
          # (Do NOT point GNUPGHOME at $RUNNER_TEMP in bash — the Windows
          #  path form (D:\a\_temp) mangles backslash escapes.)
          gpg --version | head -1
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor hashes.txt
          # self-check before shipping: the imported key includes the public part
          gpg --batch --verify hashes.txt.asc hashes.txt
          ls -l hashes.txt.asc
          echo "gpg fingerprint:"

          gpg --batch --with-colons --list-keys | awk -F: '/^pub/{next} /^fpr/{print $10}'

      - name: Commit regenerated hashes.txt (only when on a branch)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git symbolic-ref -q HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Output "detached HEAD (tag-triggered build): hashes.txt generated locally, commit skipped"
            exit 0
          }
          git add hashes.txt
          git commit -m "build: regenerate hashes.txt from CI build" 2>$null
          if ($LASTEXITCODE -eq 0) {
            git push
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
            Write-Output "hashes.txt committed and pushed"
          } else {
            Write-Output "hashes.txt unchanged; nothing to commit"
          }

      - name: Pack upload zip (16 files)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -in @('main','master','')) { $tag = "${{ inputs.release_tag }}" }
          if ($tag -eq '') { $tag = 'dev' }
          $zipName = "DeepSeek-Harness-Toolkit_${tag}_upload-package.zip"
          $items = @('DeepSeek Harness Toolkit.exe','Toolkit GUI.exe','Toolkit GUI Standalone.exe','dsh_v2.cs','build_exe.cmd','icon.ico','logo.png','README.md','README_zh-CN.md','LICENSE','SECURITY.md','verify.ps1','.gitignore','hashes.txt','hashes.txt.asc','.dsh_launcher_root')
          Compress-Archive -Path $items -DestinationPath $zipName -CompressionLevel Optimal
          Write-Output ("zip: " + [math]::Round((Get-Item $zipName).Length/1KB,1) + " KB")

      - name: Attach release assets (tag builds only; target release must be a DRAFT)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -in @('main','master','')) { $tag = "${{ inputs.release_tag }}" }
          if ($tag -eq '') { Write-Output 'no release tag provided; skipping release upload'; exit 0 }
          # 不可变发布（immutable releases）兼容：资产只在 tag 构建时一次性附加；
          # release 不存在时自动建 DRAFT（notes 发布前定稿）；已发布则拒绝上传（冻结）。
          if ($env:GITHUB_REF_TYPE -ne 'tag') { Write-Output "non-tag run ($env:GITHUB_REF_TYPE): upload skipped (immutable-release flow)"; exit 0 }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          $isDraft = $LASTEXITCODE -eq 0 ? (gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft) : 'missing'
          if ($isDraft -eq 'missing') {
            Write-Output "release '$tag' not found; creating as DRAFT (notes finalized before publish)"
            gh release create $tag --draft --repo $env:GITHUB_REPOSITORY --title "dsh-toolkit $tag (draft - CI attaching assets)" --notes "Assets are being attached by CI. Release notes will be finalized before publishing."
            if ($LASTEXITCODE -ne 0) { throw "failed to create draft release $tag" }
          } elseif ($isDraft -ne 'true') {
            Write-Output "release '$tag' is already PUBLISHED (immutable); refusing to modify its assets"
            exit 0
          }
          function Upload([string]$file, [string]$tag, [string]$repo) {
            for ($i = 1; $i -le 5; $i++) {
              gh release upload $tag $file --repo $repo --clobber
              if ($LASTEXITCODE -eq 0) { return }
              Write-Output "upload retry $i (transient GitHub 5xx) for $file"
              Start-Sleep -Seconds 5
            }
            throw "upload failed after retries: $file"
          }
          Upload "DeepSeek Harness Toolkit.exe" $tag $env:GITHUB_REPOSITORY
          Upload "Toolkit GUI.exe" $tag $env:GITHUB_REPOSITORY
          Upload "Toolkit GUI Standalone.exe" $tag $env:GITHUB_REPOSITORY
          Upload "hashes.txt" $tag $env:GITHUB_REPOSITORY
          Upload "hashes.txt.asc" $tag $env:GITHUB_REPOSITORY
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          # 改名迁移安全网：只清理核心 exe 的历史命名残留（DeepSeek.Harness.Toolkit.<版本>.exe 等），
          # 保留 Toolkit.GUI.exe 等其他合法资产（GUI 面板是与核心并列的独立发布物）
          $oldExes = $assets | Where-Object { $_ -match '^DeepSeek\.Harness\.Toolkit(\..+)?\.exe$' -and $_ -ne 'DeepSeek.Harness.Toolkit.exe' }
          foreach ($oe in $oldExes) { gh release delete-asset $tag $oe --repo $env:GITHUB_REPOSITORY }
          $zipName = "DeepSeek-Harness-Toolkit_${tag}_upload-package.zip"
          Upload $zipName $tag $env:GITHUB_REPOSITORY
          Write-Output "assets attached to release $tag (publish with: gh release edit $tag --draft=false)"

      - name: Attest build provenance (tag builds only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0，固定 commit SHA
        with:
          subject-path: |
            DeepSeek Harness Toolkit.exe
            Toolkit GUI.exe
            Toolkit GUI Standalone.exe
            hashes.txt
            hashes.txt.asc
            DeepSeek-Harness-Toolkit_*_upload-package.zip